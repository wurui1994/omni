<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Omni Studio</title>
<!-- 图标**内联**（data: 的 SVG）：一是浏览器不再去要 `/favicon.ico`（那一格 404 是服务
     日志里唯一的红字），二是单体 HTML 那一份在 file:// 上也有图标 —— 外链在那条路上取不到。 -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='rgb(20,22,28)'/><circle cx='16' cy='14' r='7.5' fill='none' stroke='rgb(122,178,255)' stroke-width='3'/><rect x='6.5' y='21.5' width='19' height='3' rx='1.5' fill='rgb(122,178,255)'/></svg>">
<link rel="stylesheet" href="/studio.css">
</head>
<body data-mode="show">

<header class="bar">
  <button class="icon-btn only-narrow" id="btn-tree" aria-label="目录">
    <svg viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
  </button>
  <div class="brand">
    <span class="dot"></span>
    <b>Omni</b><span class="muted">Studio</span>
  </div>

  <div class="seg" role="tablist" aria-label="模式">
    <button data-mode="show" class="on">展示</button>
    <button data-mode="ide">IDE</button>
    <button data-mode="console">控制台</button>
    <button data-mode="lab">实验室</button>
  </div>

  <div class="spacer"></div>

  <div class="swatches" id="swatches" aria-label="强调色"></div>
  <button class="icon-btn" id="btn-theme" aria-label="深浅">
    <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="4.2"/><path d="M10 1.6v2.2M10 16.2v2.2M1.6 10h2.2M16.2 10h2.2M4.1 4.1l1.5 1.5M14.4 14.4l1.5 1.5M15.9 4.1l-1.5 1.5M5.6 14.4l-1.5 1.5"/></svg>
  </button>
</header>

<main class="shell">
  <!-- 首页（展示模式）：一屏卡片，每格一张真跑出来的图。上哪几格由 `gallery.js` 说。
       它与下面那三栏是**互斥**的两套版面（CSS 按 body 的 data-mode 切）。 -->
  <section class="gallery" id="gallery">
    <header class="gal-head">
      <h1>看得见的编译器</h1>
      <p>同一条管线编十几门语言。下面每一格都是现在这台机器上跑出来的 ——
         点一下就进 IDE，改一行再跑。</p>
      <!-- 单体 HTML 那一份里这句会露出来：那份只跑得了图那条腿，asy 与 omni 的卡片
           不摆上去（摆上去只会是一排红字）。 -->
      <p class="gal-note" id="gallery-note" hidden></p>
    </header>
    <div class="gal-grid" id="gallery-grid"></div>
  </section>

  <!-- 控制台（matlab / spyder / idle 那一种）：命令行 + 变量区 + 绘图区。
       与展示、IDE 三套版面互斥（CSS 按 body 的 data-mode 切）。
       会话在服务那侧（`/api/repl`）—— 与终端上 `omni repl` 是同一台机器。 -->
  <section class="console" id="console">
    <div class="pane con-main">
      <div class="pane-head">
        <span>命令行</span>
        <span class="tag" id="con-lang-tag">omni</span>
        <div class="spacer"></div>
        <select id="con-lang" title="这一格会话按哪门语言读">
          <option value="omni">omni</option>
          <option value="sx">sx</option>
        </select>
        <button class="icon-btn sm" id="con-reset" title="忘掉整格会话（:reset）">
          <svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 6-6M4 10l-.5-3M4 10l3 .5"/></svg>
        </button>
      </div>
      <div class="con-log" id="con-log"></div>
      <div class="sh-in">
        <span class="ps1" id="con-ps1">&gt;</span>
        <input id="con-in" placeholder="x = 10   然后   x * x" spellcheck="false"
               autocapitalize="off" autocomplete="off">
      </div>
    </div>
    <div class="pane con-vars">
      <div class="pane-head"><span>变量</span><div class="spacer"></div>
        <span class="badge" id="con-nvars"></span></div>
      <div class="con-vars-body" id="con-vars"><div class="hint">还没有变量</div></div>
    </div>
    <div class="pane con-plot">
      <div class="pane-head"><span>绘图</span></div>
      <div class="con-plot-body" id="con-plot">
        <div class="hint">出一张图：<code>import "std/plot.omni";</code> 然后
          <code>plotLine("t", xs, ys).show()</code></div>
      </div>
    </div>
  </section>

  <!-- 实验室（Language Laboratory）：语法编辑 + 实时解析 + AST 可视化 + 管线探针。
       与展示、IDE、控制台是**四套互斥的版面**。
       语法表构建与解析全在浏览器里跑（readGrammar / buildTable / glrParse 是纯函数），
       管线面板走 /api/emit。 -->
  <section class="lab" id="lab">
    <div class="lab-edit">
      <div class="pane lab-grammar">
        <div class="pane-head">
          <span>语法</span>
          <select id="lab-load" title="加载项目里的 .grammar 文件">
            <option value="">— 模板 —</option>
          </select>
          <div class="spacer"></div>
          <span class="tag" id="lab-lang-tag"></span>
        </div>
        <div class="code-body">
          <pre id="lab-gview" class="hl"><code></code></pre>
          <textarea id="lab-grammar" spellcheck="false" autocapitalize="off" autocomplete="off"
            placeholder="在这里写语法（S-expression）…"></textarea>
        </div>
      </div>
      <div class="pane lab-sample">
        <div class="pane-head"><span>示例源码</span></div>
        <div class="code-body">
          <pre id="lab-sview" class="hl"><code></code></pre>
          <textarea id="lab-sample" spellcheck="false" autocapitalize="off" autocomplete="off"
            placeholder="用上面那门语言写一段代码…"></textarea>
        </div>
      </div>
    </div>
    <div class="pane lab-inspect">
      <div class="pane-head">
        <div class="seg small" id="lab-tabs">
          <button data-tab="lab-table" class="on">表</button>
          <button data-tab="lab-tree">树</button>
          <button data-tab="lab-pipeline">管线</button>
          <button data-tab="lab-examples">示例</button>
        </div>
        <div class="spacer"></div>
        <span class="badge" id="lab-status"></span>
      </div>
      <div class="lab-body">
        <div class="tabp on" data-tab="lab-table" id="lab-table"></div>
        <div class="tabp" data-tab="lab-tree" id="lab-tree-panel"></div>
        <div class="tabp" data-tab="lab-pipeline" id="lab-pipeline"></div>
        <div class="tabp" data-tab="lab-examples" id="lab-examples"></div>
      </div>
    </div>
  </section>

  <aside class="pane tree" id="tree">
    <div class="pane-head">
      <span>目录</span>
      <input id="filter" type="search" placeholder="过滤…" spellcheck="false">
      <button class="icon-btn sm" id="btn-new" aria-label="新建文件" title="新建文件">
        <svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>
      </button>
    </div>
    <div class="tree-body" id="tree-body"><div class="hint">正在读目录树…</div></div>
  </aside>

  <section class="pane code">
    <div class="pane-head">
      <span id="cur-path" class="path">选一份文件</span>
      <span class="tag" id="cur-lang"></span>
      <div class="spacer"></div>
      <label class="check" title="改一行就跑一趟"><input type="checkbox" id="live"><span>实时</span></label>
      <!-- js 默认原样交给 node（`--direct`）。勾上才走我们的前端 —— 这一页的用处之一
           是拿真 node 当参照，所以"对照"要是默认的那一边。别的语言上这一格藏起来。 -->
      <label class="check" id="js-parse-box" hidden title="走我们的 js 前端（不勾 = 原样交给 node）">
        <input type="checkbox" id="js-parse"><span>我们的解析</span>
      </label>
      <!-- asy 有两条出口，各有各的缺口，所以给个开关、默认走 EPS：
           **EPS**（不勾）由这一页翻成 SVG（`render.js` 的 `epsToSvg`）—— 路径与**位图**
           都有（三维那一族的 EPS 里就是一整张位图），欠的是 TeX 标签（那是 dvips 写的字节）。
           **原生 SVG**（勾上，`-f svg`）标签走 `<text>`，可位图那一族还没接 ——
           量出来：三维的例子在那条路上是一整块黑。 -->
      <label class="check" id="asy-svg-box" hidden title="asy 走原生 SVG 出口（标签有了，但位图那一族还没接）">
        <input type="checkbox" id="asy-svg"><span>SVG 出图</span>
      </label>
      <button class="run" id="btn-run"><svg viewBox="0 0 20 20"><path d="M6 4l10 6-10 6z"/></svg>运行</button>
    </div>
    <div class="code-body">
      <pre id="view" class="hl"><code></code></pre>
      <textarea id="edit" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
    </div>
  </section>

  <section class="pane out">
    <div class="pane-head">
      <div class="seg small" id="out-tabs">
        <button data-tab="stdout" class="on">输出</button>
        <button data-tab="preview" disabled>预览</button>
        <button data-tab="stages">阶段</button>
        <button data-tab="shell">Shell</button>
      </div>
      <div class="spacer"></div>
      <span class="badge" id="status"></span>
    </div>
    <div class="out-body">
      <div class="tabp on" data-tab="stdout"><pre id="stdout"></pre><pre id="stderr" class="err"></pre></div>
      <!-- 预览：markdown 排版 / asy 的图（EPS -> SVG）/ glsl 的着色器（WebGL2）。 -->
      <div class="tabp" data-tab="preview"><div id="preview" class="preview empty"></div></div>
      <div class="tabp" data-tab="stages"><div id="stages" class="stages"></div></div>
      <div class="tabp" data-tab="shell">
        <div id="sh-log" class="sh-log"></div>
        <div class="sh-in">
          <span class="ps1">$</span>
          <input id="sh" placeholder="omni run … / go run x.go / ls docs" spellcheck="false"
                 autocapitalize="off" autocomplete="off">
        </div>
      </div>
    </div>
  </section>
</main>

<script type="module" src="/studio.js"></script>
</body>
</html>
