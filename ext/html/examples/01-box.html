<!DOCTYPE html>
<!-- Omni Studio 的 html 例子之一：**这一门的"运行"就是浏览器自己**。
     预览那一栏把这份源码原样塞进一格 `<iframe srcdoc=…>`（沙箱里只开脚本），
     所以这儿写什么都算数 —— 我们一个字都不译。改一行就看得见。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>盒子与渐变</title>
<style>
  body { margin: 0; font: 15px/1.6 -apple-system, "SF Pro Text", system-ui, sans-serif;
         background: #0b0b0f; color: #f5f5f7; display: grid; place-items: center; min-height: 100vh; }
  .card { width: 320px; padding: 24px; border-radius: 18px;
          background: linear-gradient(145deg, #1f2233, #12131c);
          box-shadow: 0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06); }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.02em; }
  p { margin: 0 0 16px; color: #a1a1a6; font-size: 13px; }
  .bars { display: flex; gap: 6px; align-items: flex-end; height: 72px; }
  .bars i { flex: 1; border-radius: 4px 4px 0 0;
            background: linear-gradient(180deg, #0a84ff, #5e5ce6); animation: rise .9s ease both; }
  @keyframes rise { from { height: 4px; opacity: 0 } }
</style>
</head>
<body>
  <div class="card">
    <h1>盒子与渐变</h1>
    <p>纯 CSS：圆角、渐变、阴影、关键帧动画。</p>
    <div class="bars">
      <i style="height:28%;animation-delay:.00s"></i>
      <i style="height:52%;animation-delay:.06s"></i>
      <i style="height:78%;animation-delay:.12s"></i>
      <i style="height:44%;animation-delay:.18s"></i>
      <i style="height:96%;animation-delay:.24s"></i>
      <i style="height:64%;animation-delay:.30s"></i>
    </div>
  </div>
</body>
</html>
